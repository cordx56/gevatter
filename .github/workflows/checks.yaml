name: Checks

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check all
        run: |
          export RUST_COMPONENTS="rustfmt,clippy"
          ./x cargo fmt --all --check
          ./x cargo clippy --workspace
