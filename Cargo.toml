[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    "crates/cargo-gevatter",
    "crates/gevatter_rustc_toolchain"
]
exclude = ["examples"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
documentation = "https://github.com/cordx56/gevatter/blob/main/README.md"
readme = "README.md"
repository = "https://github.com/cordx56/gevatter"
description = "Diagnoses and fixes lifetime annotations where rustc and Clippy offer no automatic fix"
categories = ["development-tools::debugging"]

[workspace.dependencies]
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive", "color"] }
indexmap = "2"
liblzma = { version = "0.4", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", default-features = false, features = ["std"] }
tar = { version = "0.4", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
