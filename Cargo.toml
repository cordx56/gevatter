[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cargo_metadata = "0.23"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", default-features = false, features = ["std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
